# SSM Automation runbook — remediation for the detective `s3-public-access` check.
#
# This file is a Terraform template: infra/corrective/ renders it with
# `templatefile`, injecting the scoped automation role ARN into `assumeRole`.
# SSM's own parameter syntax uses double braces, which does NOT collide with
# Terraform's dollar-brace interpolation, so the two coexist cleanly.
#
# What it does: re-enables ALL FOUR S3 Block Public Access settings on the one
# bucket the check flagged, and records exactly WHICH flags it changed.
#
# It uses a single aws:executeScript that reads-before-write, so it can report an
# accurate `changed_flags` list (an already-compliant bucket returns [] rather
# than looking identical to a freshly-remediated one). PutPublicAccessBlock to
# all-true is IDEMPOTENT and MONOTONIC-SECURE — it can only make a bucket *more*
# private — so we skip the Put entirely when nothing needs changing, then verify
# all four flags before ending. Contrast the security-group runbook, where the
# mutation is destructive and a pre-guard matters more.
schemaVersion: '0.3'
description: >-
  Re-enable S3 Block Public Access (all four settings) on a bucket flagged by the
  ccg detective s3-public-access check. Idempotent, strictly security-improving,
  and records which flags it changed.
assumeRole: '${automation_role_arn}'
parameters:
  BucketName:
    type: String
    description: The S3 bucket to re-block public access on.
    # S3 bucket naming rules: 3–63 chars, lowercase letters/digits/dots/hyphens,
    # starting and ending alphanumeric. Constraining the input here stops a
    # malformed or injected value from ever reaching the API call.
    allowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
mainSteps:
  - name: BlockPublicAccessAndVerify
    action: aws:executeScript
    description: Read current BPA, set any missing flags, verify all four, report changes.
    isEnd: true
    inputs:
      Runtime: python3.11
      Handler: remediate
      InputPayload:
        BucketName: '{{ BucketName }}'
      Script: |-
        import boto3
        from botocore.exceptions import ClientError

        FLAGS = ["BlockPublicAcls", "IgnorePublicAcls", "BlockPublicPolicy", "RestrictPublicBuckets"]

        def _current(s3, bucket):
            try:
                cfg = s3.get_public_access_block(Bucket=bucket)["PublicAccessBlockConfiguration"]
                return {f: cfg.get(f, False) for f in FLAGS}
            except ClientError as e:
                # No configuration at all == every flag effectively off.
                if e.response["Error"]["Code"] == "NoSuchPublicAccessBlockConfiguration":
                    return dict.fromkeys(FLAGS, False)
                raise

        def remediate(events, context):
            s3 = boto3.client("s3")
            bucket = events["BucketName"]

            before = _current(s3, bucket)
            changed = [f for f in FLAGS if not before[f]]

            # Only mutate if something is actually off (keeps history honest and
            # avoids a needless write on an already-compliant bucket).
            if changed:
                s3.put_public_access_block(
                    Bucket=bucket,
                    PublicAccessBlockConfiguration=dict.fromkeys(FLAGS, True),
                )

            # Verify ALL four afterward — one flag left false still allows exposure.
            still_off = [f for f in FLAGS if not _current(s3, bucket)[f]]
            if still_off:
                raise Exception(f"Block Public Access still disabled for: {still_off}")

            return {"changed_flags": changed, "already_compliant": not changed}
    outputs:
      - Name: changed_flags
        Selector: $.Payload.changed_flags
        Type: StringList
